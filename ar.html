<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Expérience AR</title>

  <!-- A-Frame + MindAR (tracking d'image 6DOF : perspective, position, inclinaison) -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    /* IMPORTANT : ne JAMAIS mettre de fond opaque sur html/body.
       MindAR insère le flux caméra en z-index négatif : un fond sur body
       se peindrait PAR-DESSUS la caméra (écran noir). Le fond noir
       d'attente est assuré par #backdrop, placé sous la caméra. */
    html, body { height: 100%; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }

    #backdrop { position: fixed; inset: 0; background: #000; z-index: -3; }

    #ui-header {
      position: fixed; top: 0; left: 0; right: 0; padding: 14px 16px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.75), transparent);
      color: #fff; font-size: 15px; font-weight: 600; text-align: center;
      z-index: 9999; pointer-events: none; letter-spacing: 0.3px;
    }

    #status-badge {
      position: fixed; top: 50px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.55); color: #fff; padding: 6px 16px;
      border-radius: 20px; font-size: 13px; z-index: 9999; pointer-events: none;
      transition: opacity .3s; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
      white-space: nowrap;
    }

    #btn-sound {
      position: fixed; bottom: 24px; right: 20px; z-index: 9999;
      background: rgba(0,0,0,0.6); color: #fff; border: none;
      width: 52px; height: 52px; border-radius: 50%; font-size: 22px; cursor: pointer;
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
      display: none;
    }

    #error-box {
      position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
      background: #111; color: #eee; z-index: 10000; padding: 32px; text-align: center;
      font-size: 15px; line-height: 1.7;
    }
    #error-box a { color: #7EC8E3; }

    a-scene { width: 100vw; height: 100vh; }
  </style>
</head>
<body>

  <div id="backdrop"></div>
  <div id="ui-header">📷 Expérience AR</div>
  <div id="status-badge">⏳ Chargement des expériences…</div>
  <button id="btn-sound" title="Activer le son">🔇</button>
  <div id="error-box"><div id="error-msg"></div></div>

  <!-- La scène A-Frame est construite dynamiquement à partir de assets/experiences.json -->

  <script>
    // ═══════════════════════════════════════════════════════════
    // COMPOSANT CHROMA KEY — supprime une couleur (ex. fond vert)
    // Shader : chaque pixel proche de la couleur clé devient
    // transparent, avec un adoucissement des bords (smoothstep).
    // ═══════════════════════════════════════════════════════════
    AFRAME.registerComponent('chroma-material', {
      schema: {
        assetId:    { type: 'string' },
        isVideo:    { type: 'boolean', default: true },
        color:      { type: 'string', default: '#00ff00' },
        similarity: { type: 'number', default: 0.4 },
        smoothness: { type: 'number', default: 0.1 },
        opacity:    { type: 'number', default: 1.0 },
      },

      init() {
        this.applyMaterial = this.applyMaterial.bind(this);
        if (this.el.getObject3D('mesh')) this.applyMaterial();
        else this.el.addEventListener('object3dset', this.applyMaterial);
      },

      applyMaterial() {
        const mesh = this.el.getObject3D('mesh');
        if (!mesh || this._done) return;
        this._done = true;

        try {
          const srcEl = document.getElementById(this.data.assetId);
          let texture;
          if (this.data.isVideo) {
            texture = new THREE.VideoTexture(srcEl);
          } else {
            texture = new THREE.TextureLoader().load(srcEl.src);
          }
          texture.minFilter = THREE.LinearFilter;
          texture.magFilter = THREE.LinearFilter;

          // Couleur clé en valeurs sRGB brutes (mêmes valeurs que la texture échantillonnée)
          const hex = parseInt(this.data.color.replace('#', ''), 16);
          const keyColor = new THREE.Vector3(
            ((hex >> 16) & 255) / 255, ((hex >> 8) & 255) / 255, (hex & 255) / 255
          );

          const material = new THREE.ShaderMaterial({
            transparent: true,
            side: THREE.DoubleSide,
            uniforms: {
              map:        { value: texture },
              keyColor:   { value: keyColor },
              similarity: { value: this.data.similarity },
              smoothness: { value: this.data.smoothness },
              opacity:    { value: this.data.opacity },
            },
            vertexShader: `
              varying vec2 vUv;
              void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
              }`,
            fragmentShader: `
              uniform sampler2D map;
              uniform vec3 keyColor;
              uniform float similarity;
              uniform float smoothness;
              uniform float opacity;
              varying vec2 vUv;
              void main() {
                vec4 c = texture2D(map, vUv);
                float dist = distance(c.rgb, keyColor);
                float alpha = smoothstep(similarity, similarity + max(smoothness, 0.001), dist);
                gl_FragColor = vec4(c.rgb, c.a * alpha * opacity);
              }`,
          });
          mesh.material = material;
        } catch (e) {
          console.error('chroma-material : échec, matériau standard conservé', e);
        }
      },
    });

    // ═══════════════════════════════════════════════════════════
    const badge = document.getElementById('status-badge');
    const soundBtn = document.getElementById('btn-sound');

    function fail(html) {
      document.getElementById('error-msg').innerHTML = html;
      document.getElementById('error-box').style.display = 'flex';
    }

    // Rétrocompatibilité : convertit une config v1 (1 contenu/expérience)
    // au format v2 (calques multiples).
    function normalizeConfig(config) {
      (config.experiences || []).forEach((exp) => {
        if (!exp.layers) {
          exp.layers = [{
            type: exp.type, src: exp.src, contentAspect: exp.contentAspect,
            scale: exp.scale, offsetX: exp.offsetX, offsetY: exp.offsetY,
            opacity: exp.opacity ?? 1, chroma: exp.chromaKey ? { color: '#00ff00', similarity: 0.4, smoothness: 0.1 } : null,
          }];
        }
      });
      return config;
    }

    async function init() {
      // ── 1. Charge la configuration générée par le studio ──
      let config;
      try {
        const res = await fetch('assets/experiences.json', { cache: 'no-store' });
        if (!res.ok) throw new Error(res.status);
        config = normalizeConfig(await res.json());
      } catch (e) {
        return fail(`Aucune expérience publiée pour l'instant.<br><br>
          Créez-en une dans le <a href="studio.html">🎬 Studio</a>, puis placez le contenu
          du pack généré dans le dossier <b>assets/</b> du site.`);
      }
      if (!config.experiences || config.experiences.length === 0) {
        return fail(`Le fichier de configuration est vide.<br>
          Générez un pack dans le <a href="studio.html">🎬 Studio</a>.`);
      }

      // ── 2. Construit la scène AR ──
      const scene = document.createElement('a-scene');
      scene.setAttribute('mindar-image',
        'imageTargetSrc: assets/targets.mind; maxTrack: 1; uiScanning: yes; uiLoading: yes; ' +
        'filterMinCF: 0.0001; filterBeta: 0.01; missTolerance: 8; warmupTolerance: 2');
      scene.setAttribute('color-space', 'sRGB');
      scene.setAttribute('renderer', 'colorManagement: true; physicallyCorrectLights: true');
      scene.setAttribute('vr-mode-ui', 'enabled: false');
      scene.setAttribute('device-orientation-permission-ui', 'enabled: false');
      scene.setAttribute('embedded', '');

      const assets = document.createElement('a-assets');
      assets.setAttribute('timeout', '30000');
      scene.appendChild(assets);

      const videos = [];
      const assetIds = new Map(); // src -> assetId (dédoublonnage)

      config.experiences.forEach((exp, i) => {
        const target = document.createElement('a-entity');
        target.setAttribute('mindar-image-target', 'targetIndex: ' + i);
        const expVideos = [];

        exp.layers.forEach((layer, j) => {
          // ── Asset (vidéo ou image), partagé si déjà déclaré ──
          let assetId = assetIds.get(layer.src);
          if (!assetId) {
            assetId = `asset-${i}-${j}`;
            assetIds.set(layer.src, assetId);
            if (layer.type === 'video') {
              const v = document.createElement('video');
              v.id = assetId;
              v.src = 'assets/' + layer.src;
              v.setAttribute('preload', 'auto');
              v.setAttribute('playsinline', ''); v.setAttribute('webkit-playsinline', '');
              v.muted = true; v.loop = true; v.crossOrigin = 'anonymous';
              assets.appendChild(v);
              videos.push(v);
            } else {
              const img = document.createElement('img');
              img.id = assetId;
              img.src = 'assets/' + layer.src;
              img.crossOrigin = 'anonymous';
              assets.appendChild(img);
            }
          }
          if (layer.type === 'video') expVideos.push(assetId);

          // ── Plan du calque ──
          // Convention MindAR : largeur de l'image de référence = 1 unité.
          // Les calques peuvent dépasser le cadre (scale > 1, offsets libres).
          const w = layer.scale;
          const h = w * layer.contentAspect;
          let plane;
          if (layer.chroma) {
            // Plan neutre + shader chroma key
            plane = document.createElement('a-plane');
            plane.setAttribute('material', 'transparent: true; opacity: 0');
            plane.setAttribute('chroma-material',
              `assetId: ${assetId}; isVideo: ${layer.type === 'video'}; ` +
              `color: ${layer.chroma.color}; similarity: ${layer.chroma.similarity}; ` +
              `smoothness: ${layer.chroma.smoothness}; opacity: ${layer.opacity ?? 1}`);
          } else {
            plane = document.createElement(layer.type === 'video' ? 'a-video' : 'a-image');
            plane.setAttribute('src', '#' + assetId);
            plane.setAttribute('opacity', layer.opacity ?? 1);
          }
          plane.setAttribute('width', w);
          plane.setAttribute('height', h);
          // léger décalage en Z par calque pour éviter le scintillement (z-fighting)
          plane.setAttribute('position', `${layer.offsetX} ${layer.offsetY} ${0.01 + j * 0.02}`);
          target.appendChild(plane);
        });

        // ── Lecture vidéo pilotée par la détection ──
        target.addEventListener('targetFound', () => {
          badge.textContent = '✅ « ' + exp.name + ' » détectée';
          badge.style.background = 'rgba(39,174,96,0.75)';
          expVideos.forEach((id) => {
            const v = document.getElementById(id);
            v.play().catch(() => {
              document.addEventListener('touchstart', () => v.play(), { once: true });
            });
          });
          if (expVideos.length) soundBtn.style.display = 'block';
        });
        target.addEventListener('targetLost', () => {
          badge.textContent = '🔍 Recherche d\'une image…';
          badge.style.background = 'rgba(0,0,0,0.55)';
          expVideos.forEach((id) => document.getElementById(id).pause());
        });

        scene.appendChild(target);
      });

      // Caméra MindAR (ne pas modifier)
      const camera = document.createElement('a-camera');
      camera.setAttribute('position', '0 0 0');
      camera.setAttribute('look-controls', 'enabled: false');
      scene.appendChild(camera);

      document.body.appendChild(scene);
      badge.textContent = '🔍 Pointez la caméra vers une image de référence';

      // ── 3. Bouton son (les vidéos démarrent muettes) ──
      let soundOn = false;
      soundBtn.addEventListener('click', () => {
        soundOn = !soundOn;
        videos.forEach((v) => { v.muted = !soundOn; });
        soundBtn.textContent = soundOn ? '🔊' : '🔇';
      });
    }

    init();
  </script>

</body>
</html>
